name: ML CI Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "training/**"
      - "inference/**"
      - "models/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/**"

  pull_request:
    paths:
      - "training/**"
      - "inference/**"
      - "models/**"
      - "Dockerfile"
      - "requirements.txt"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Linting
      - name: Lint Code
        run: |
          pip install flake8
          flake8 .

      # Testing
      - name: Run Tests
        run: |
          pip install pytest
          export PYTHONPATH=$PYTHONPATH:.
          pytest

      # Sanity check
      - name: Check App Import
        run: |
          python -c "from inference.app import app"


  docker:
    runs-on: ubuntu-latest
    needs: test   # 👈 runs only if test job passes
    if: github.ref == 'refs/heads/main'   # 👈 only on main branch

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t transaction-risk-ml .

      - name: Run Container Test
        run: |
          docker run -d -p 8000:8000 transaction-risk-ml
          sleep 10

      # CD: Deploy to Render
      - name: Trigger Render Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}