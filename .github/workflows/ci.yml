name: ML CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      #  LINTING STEP (ADD HERE)
      - name: Lint Code
        run: |
          pip install flake8
          flake8 .

      #  TESTING
      - name: Run Tests
        run: |
          pip install pytest
          pytest

      - name: Check App Import
        run: |
          python -c "import inference.app"

      - name: Build Docker Image
        run: |
          docker build -t transaction-risk-ml .

      - name: Run Container Test
        run: |
          docker run -d -p 8000:8000 transaction-risk-ml
          sleep 10

      #  CD
      - name: Trigger Render Deploy
        if: success() && github.ref == 'refs/heads/main'
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}